name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export models (Falconsai, Marqo, NudeNet)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "optimum[onnxruntime]" onnxruntime timm nudenet
          python tools/export_models.py
          mkdir -p app/src/main/assets
          cp assets_out/* app/src/main/assets/

      - name: Download website blocklist (StevenBlack/hosts, porn-only)
        run: |
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts \
            -o app/src/main/assets/blocklist.txt || : > app/src/main/assets/blocklist.txt
          wc -l app/src/main/assets/blocklist.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SafeVision-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
